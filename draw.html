<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>振明 & 珮君 婚禮抽獎機</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#345166;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:radial-gradient(ellipse at center,#fff 0%,#f5fbff 48%,#dceefa 100%);overflow-x:hidden}
body:before,body:after{content:"";position:fixed;z-index:-1;pointer-events:none;width:42vw;height:42vw;min-width:300px;min-height:300px;opacity:.58;background-image:radial-gradient(circle at 50% 20%,#b6d5f0 0 13px,transparent 14px),radial-gradient(circle at 30% 40%,#d2e5f6 0 15px,transparent 16px),radial-gradient(circle at 70% 40%,#c1dbf1 0 16px,transparent 17px),radial-gradient(circle at 50% 60%,#e2effa 0 17px,transparent 18px),radial-gradient(circle at 20% 70%,#b6d5f0 0 13px,transparent 14px),radial-gradient(circle at 80% 75%,#d1e5f5 0 14px,transparent 15px),radial-gradient(circle at 50% 40%,#f7fbff 0 9px,transparent 10px)}body:before{left:-7vw;top:-5vw}body:after{right:-8vw;bottom:-8vw;transform:rotate(25deg)}
main{max-width:940px;margin:auto;padding:28px 16px 48px;text-align:center}.floral{color:#9bbdd8;letter-spacing:.5em;font-size:1.2rem}.kicker{font-size:.8rem;letter-spacing:.22em;color:#8ba9c2;margin-top:18px}h1{font-family:Georgia,"Noto Serif TC",serif;font-weight:500;font-size:clamp(2rem,6vw,3.3rem);margin:12px 0;color:#3f6684}.slogan{font-family:"Noto Serif TC",serif;color:#7e9fb9;font-size:clamp(1rem,3vw,1.3rem);letter-spacing:.15em;margin:12px 0 26px}.panel{background:rgba(255,255,255,.82);border:1px solid #d3e4f2;border-radius:26px;box-shadow:0 12px 36px #789bb31f;padding:clamp(16px,4vw,30px);backdrop-filter:blur(5px)}.label{font-size:.83rem;letter-spacing:.16em;color:#87a5bd}.number-ball{margin:18px auto 20px;width:min(58vw,230px);aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#edf7ff);border:8px solid #d6e8f6;outline:1px solid #b6d2e7;box-shadow:inset 0 0 25px #d5e8f5a0,0 10px 24px #9eb9ce30;display:flex;align-items:center;justify-content:center;color:#466d8b;font-size:clamp(4rem,14vw,6rem);font-weight:800}.number-ball small{font-size:.22em;display:block;color:#aac4d9;letter-spacing:.1em}.draw{background:linear-gradient(120deg,#91b9d7,#699bbf);border:0;border-radius:999px;padding:15px 40px;color:white;font-weight:800;font-size:1.15rem;letter-spacing:.15em;box-shadow:0 5px 0 #5d87a8;cursor:pointer}.draw:active{transform:translateY(3px);box-shadow:0 2px 0 #5d87a8}.draw:disabled{opacity:.5}.meta{margin:14px 0;color:#8ba5b9;font-size:.9rem}.controls{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:15px}.control{border:1px solid #d2e3f1;background:#fff;color:#6b8ca8;border-radius:20px;padding:9px 15px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:18px}.cell{border:1px solid #d9e8f3;background:#fff;border-radius:8px;min-height:38px;display:grid;place-items:center;color:#7e9ab0;font-size:.9rem;font-weight:700}.cell.hit{background:#d4e8f7;border-color:#8fb8d5;color:#426b8b}.history-wrap{margin-top:22px;text-align:left}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#6f8fa9}.history-head h2{font-size:1.08rem;margin:0;font-weight:700}.history{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px;min-height:38px}.pill{background:#e6f2fb;border:1px solid #c8dfef;color:#537997;padding:8px 12px;border-radius:999px;font-weight:800}.pill.new{background:#c9e1f3;border-color:#8fb8d5}.empty{color:#a4b8c8;font-size:.9rem}.foot{color:#91abc0;font-size:.8rem;margin-top:24px}.finished{color:#7198b7;font-weight:bold;margin:10px 0;min-height:1.2em}
@media(min-width:760px){.mainrow{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.number-panel{min-height:100%}}@media(max-width:480px){.grid{grid-template-columns:repeat(5,1fr);gap:5px}.cell{min-height:34px;font-size:.84rem}}
</style></head><body><main>
<div class="floral">✿ ❀ ✿</div><div class="kicker">WEDDING BINGO · LUCKY MOMENTS</div><h1>振明 &amp; 珮君</h1><div class="slogan">溫柔相伴，明媚君心</div>
<div class="mainrow"><section class="panel number-panel"><div class="label">LUCKY NUMBER</div><div class="number-ball" id="ball"><div><small>READY</small>?</div></div><button class="draw" id="draw">抽出幸運號碼</button><div class="meta"><span id="count">0</span> / 75 已抽出</div><div class="finished" id="done"></div><div class="controls"><button class="control" id="undo" disabled>↶ 撤回上一號</button><button class="control" id="reset">↻ 重新開始</button><button class="control" id="fullscreen">⛶ 全螢幕</button></div></section>
<section class="panel"><div class="label">NUMBER BOARD · 1–75</div><div class="grid" id="board"></div></section></div>
<section class="panel history-wrap"><div class="history-head"><h2>已抽出號碼 · DRAWN NUMBERS</h2><strong id="historycount">0</strong></div><div class="history" id="history"><span class="empty">抽出的號碼會顯示在這裡</span></div></section>
<div class="foot">✿ 以愛之名，祝大家好運 ✿</div></main>
<script>
(()=>{const key='wedding-bingo-draw-peichun-v2';let nums=[];const $=id=>document.getElementById(id);function save(){try{localStorage.setItem(key,JSON.stringify(nums))}catch(e){}}function load(){try{let v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))nums=v.filter((n,i,a)=>Number.isInteger(n)&&n>=1&&n<=75&&a.indexOf(n)===i)}catch(e){nums=[]}}function make(){let b=$('board');b.innerHTML='';for(let n=1;n<=75;n++){let e=document.createElement('div');e.className='cell';e.dataset.n=n;e.textContent=n;b.append(e)}}function render(){let n=nums.at(-1);$('ball').innerHTML=n?`<div>${n}</div>`:`<div><small>READY</small>?</div>`;document.querySelectorAll('.cell').forEach(e=>e.classList.toggle('hit',nums.includes(+e.dataset.n)));let h=$('history');h.innerHTML='';if(!nums.length){let s=document.createElement('span');s.className='empty';s.textContent='抽出的號碼會顯示在這裡';h.append(s)}else [...nums].reverse().forEach((x,i)=>{let p=document.createElement('span');p.className='pill'+(i===0?' new':'');p.textContent=x;h.append(p)});$('count').textContent=nums.length;$('historycount').textContent=nums.length;$('undo').disabled=!nums.length;$('draw').disabled=nums.length===75;$('done').textContent=nums.length===75?'75 個號碼已全部抽完！':''}function draw(){if(nums.length>=75)return;let pool=[];for(let i=1;i<=75;i++)if(!nums.includes(i))pool.push(i);nums.push(pool[Math.floor(Math.random()*pool.length)]);save();render()}$('draw').onclick=draw;$('undo').onclick=()=>{nums.pop();save();render()};$('reset').onclick=()=>{if(confirm('確定要清除已抽號碼並重新開始嗎？')){nums=[];save();render()}};$('fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){alert('此瀏覽器暫不支援全螢幕')}};document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!['BUTTON','INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();draw()}});make();load();render()})();
</script></body></html>

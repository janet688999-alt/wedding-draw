<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e6f3fc"><title>振明 & 珮君｜Wedding Bingo</title>
<style>
:root{--blue:#315b78;--gold:#c6a45b;--ink:#294354}*{box-sizing:border-box}body{margin:0;padding:20px;background:radial-gradient(circle at top,#fff,#eaf5fc 60%,#dcecf7);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}main{max-width:650px;margin:0 auto;background:#ffffffed;border:1px solid #d5e5ef;border-radius:24px;padding:22px;box-shadow:0 15px 45px #315b781c;text-align:center}h1{color:var(--blue);font-size:clamp(2rem,8vw,3rem);margin:6px 0}.sub{color:#9a7a42;font-weight:700;letter-spacing:.12em}.panel{background:#f5faff;border:1px solid #d9e8f0;border-radius:16px;padding:15px;margin:16px 0}label{display:block;text-align:left;font-weight:650;color:var(--blue)}select,button{font:inherit;border-radius:12px;padding:12px;border:1px solid #cddfe9}select{width:100%;margin:8px 0;background:#fff;color:var(--ink)}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}.gold{background:var(--gold)}#board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:15px auto;max-width:500px}.cell{aspect-ratio:1;background:#f4f9fd;border:1px solid #cbddea;border-radius:9px;display:grid;place-items:center;font-size:clamp(1rem,5vw,1.5rem);font-weight:750;color:var(--blue);cursor:pointer;user-select:none}.cell.head{background:var(--gold);color:white;cursor:default}.cell.free{background:var(--gold);color:white}.cell.marked{background:var(--blue);color:white;box-shadow:inset 0 0 0 3px var(--gold)}.note{font-size:.85rem;color:#6d8798;line-height:1.5}.hidden{display:none}#qr{display:flex;justify-content:center;background:#fff;padding:12px;margin:12px auto;width:max-content;max-width:100%}a{color:var(--blue)}
</style></head><body><main><div class="sub">WEDDING BINGO</div><h1>振明 & 珮君</h1><p>歡迎參加婚禮 Bingo！請選擇你的賓客編號，領取專屬卡片。</p>
<section class="panel" id="choose"><label for="guest">選擇賓客編號（1–60）</label><select id="guest"><option value="">請選擇編號</option></select><button id="get" class="gold">領取我的 Bingo 卡</button><p class="note">每位賓客請使用不同編號。相同編號會取得相同卡片。</p></section>
<section id="game" class="hidden"><div class="sub" id="guestLabel"></div><div id="board"></div><p class="note">點擊格子標記；再次點擊可取消。標記會保存在這部手機的瀏覽器中。</p><button id="change" class="gold">更換／重新選擇編號</button></section>
<section class="panel"><strong>賓客掃描 QR Code</strong><p class="note">掃描後選擇自己的專屬編號 1–60。</p><div id="qr"></div><p class="note" id="qrFallback"></p></section>
<p class="note">每位賓客請使用唯一編號 1–60，卡片內容各不相同。請勿共用編號。</p><a href="index.html">返回婚禮抽獎首頁</a></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id),N=60;for(let i=1;i<=N;i++){let o=document.createElement('option');o.value=i;o.textContent='賓客 '+i;$('guest').appendChild(o)}
function rng(seed){let x=seed>>>0;return()=>{x=(x+0x6D2B79F5)|0;let t=Math.imul(x^(x>>>15),1|x);t^=t+Math.imul(t^(t>>>7),61|t);return((t^(t>>>14))>>>0)/4294967296}}
function makeCard(id){let r=rng(id*7919+20261117),cols=[];for(let c=0;c<5;c++){let a=Array.from({length:15},(_,i)=>c*15+i+1);for(let i=14;i>0;i--){let j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}cols.push(a.slice(0,5))}return Array.from({length:25},(_,i)=>i===12?'FREE':cols[i%5][Math.floor(i/5)])}
const cards=Array.from({length:N},(_,i)=>makeCard(i+1));if(new Set(cards.map(c=>c.join(','))).size!==N)throw Error('Card seed collision');
function show(id){$('choose').classList.add('hidden');$('game').classList.remove('hidden');$('guestLabel').textContent='振明 & 珮君｜賓客 '+id+' 號專屬 Bingo 卡';let key='zm-pj-bingo-'+id,marked=JSON.parse(localStorage.getItem(key)||'[]');$('board').innerHTML='';['B','I','N','G','O'].forEach(x=>{let d=document.createElement('div');d.className='cell head';d.textContent=x;$('board').appendChild(d)});cards[id-1].forEach((v,i)=>{let d=document.createElement('button');d.className='cell'+(v==='FREE'?' free':'')+(marked.includes(i)?' marked':'');d.textContent=v;d.addEventListener('click',()=>{if(v==='FREE')return;let m=new Set(JSON.parse(localStorage.getItem(key)||'[]'));m.has(i)?m.delete(i):m.add(i);localStorage.setItem(key,JSON.stringify([...m]));d.classList.toggle('marked')});$('board').appendChild(d)})}
$('get').addEventListener('click',()=>{let id=Number($('guest').value);if(id>=1&&id<=N)show(id)});$('change').addEventListener('click',()=>{$('game').classList.add('hidden');$('choose').classList.remove('hidden')});
const url=location.href.split('?')[0];$('qrFallback').textContent=url;if(window.QRCode)new QRCode($('qr'),{text:url,width:190,height:190,colorDark:'#315b78',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});
const q=new URLSearchParams(location.search),g=Number(q.get('guest'));if(g>=1&&g<=N){$('guest').value=g;show(g)}
</script></body></html>

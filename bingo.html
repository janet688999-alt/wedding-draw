<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e6f3fc">
<title>振明 & 珮君｜Wedding Bingo</title>
<style>
:root{--blue:#315b78;--gold:#c6a45b;--ink:#294354}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:radial-gradient(circle at top,#fff,#eaf5fc 60%,#dcecf7);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink)}
main{max-width:650px;margin:0 auto;background:#ffffffed;border:1px solid #d5e5ef;border-radius:24px;padding:22px;box-shadow:0 15px 45px #315b781c;text-align:center}
h1{color:var(--blue);font-size:clamp(2rem,8vw,3rem);margin:6px 0}
.sub{color:#9a7a42;font-weight:700;letter-spacing:.12em}
#board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:15px auto;max-width:500px}
.cell{aspect-ratio:1;background:#f4f9fd;border:1px solid #cbddea;border-radius:9px;display:grid;place-items:center;font-size:clamp(1rem,5vw,1.5rem);font-weight:750;color:var(--blue);cursor:pointer;user-select:none;padding:0}
.cell.free{background:var(--gold);color:white;cursor:default}
.cell.marked{background:var(--blue);color:white;box-shadow:inset 0 0 0 3px var(--gold)}
.note{font-size:.88rem;color:#6d8798;line-height:1.6}
.status{background:#f5faff;border:1px solid #d9e8f0;border-radius:16px;padding:15px;margin:16px 0}
button{font:inherit;border-radius:12px;padding:12px 18px;border:0;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
.hidden{display:none}
a{color:var(--blue)}
</style>
</head>
<body>
<main>
  <div class="sub">WEDDING BINGO</div>
  <h1>振明 & 珮君</h1>
  <p>歡迎參加婚禮 Bingo！正在為你準備專屬卡片……</p>
  <section id="loading" class="status" aria-live="polite">連線中，請稍候。</section>
  <section id="game" class="hidden">
    <div class="sub">YOUR UNIQUE BINGO CARD</div>
    <div id="board" aria-label="Bingo card"></div>
    <p class="note">點擊格子標記；再次點擊可取消。標記會保存在這部手機的瀏覽器中。</p>
    <p class="note" id="cardLabel"></p>
  </section>
  <section id="error" class="status hidden" role="alert"></section>
  <p class="note"><a href="index.html">返回婚禮首頁</a></p>
</main>

<!-- Supabase project settings: replace the two placeholders before publishing. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xdfcycnukepbwvsuraey.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2VF0XJ14xu700NKNlGBU5g_LU7DbcW5";
const TOTAL_CARDS = 70;

const $ = id => document.getElementById(id);

function rng(seed){
  let x = seed >>> 0;
  return () => {
    let t = x += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Preserves the original wedding Bingo number style: 1–75, one FREE center.
function makeCard(id){
  const r = rng(id * 7919 + 20261117);
  const cols = [];
  for(let c=0;c<5;c++){
    const a = Array.from({length:15},(_,i)=>c*15+i+1);
    for(let i=14;i>0;i--){
      const j = Math.floor(r()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    cols.push(a.slice(0,5));
  }
  return Array.from({length:25},(_,i)=>
    i===12 ? "FREE" : cols[i%5][Math.floor(i/5)]
  );
}

function getVisitorToken(){
  const key = "zm-pj-bingo-visitor-token-v1";
  let token = localStorage.getItem(key);
  if(!token){
    if(!crypto.randomUUID) throw new Error("你的瀏覽器不支援安全識別碼，請更新瀏覽器後再試。");
    token = crypto.randomUUID();
    localStorage.setItem(key, token);
  }
  return token;
}

function showCard(slot){
  const card = makeCard(slot);
  const markKey = "zm-pj-bingo-marks-" + slot;
  let marked = [];
  try { marked = JSON.parse(localStorage.getItem(markKey) || "[]"); } catch (_) {}

  $("board").innerHTML = "";
  card.forEach((value,index)=>{
    const cell = document.createElement("button");
    cell.type = "button";
    cell.className = "cell" +
      (value === "FREE" ? " free" : "") +
      (marked.includes(index) ? " marked" : "");
    cell.textContent = value;
    cell.setAttribute("aria-label", value === "FREE" ? "FREE" : "Number " + value);
    cell.addEventListener("click",()=>{
      if(value === "FREE") return;
      const current = new Set(JSON.parse(localStorage.getItem(markKey) || "[]"));
      current.has(index) ? current.delete(index) : current.add(index);
      localStorage.setItem(markKey,JSON.stringify([...current]));
      cell.classList.toggle("marked");
    });
    $("board").appendChild(cell);
  });
  $("cardLabel").textContent = "你的專屬卡片已準備好。";
  $("loading").classList.add("hidden");
  $("error").classList.add("hidden");
  $("game").classList.remove("hidden");
}

async function start(){
  try{
    if(SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")){
      throw new Error("網站尚未設定 Supabase。請先完成設定，再發布給賓客使用。");
    }
    if(!window.supabase) throw new Error("連線元件載入失敗，請重新整理頁面。");
    const client = window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const visitorToken = getVisitorToken();
    const {data,error} = await client.rpc("assign_bingo_card",{p_visitor_token:visitorToken});
    if(error) throw error;
    const slot = Number(data);
    if(!Number.isInteger(slot) || slot<1 || slot>TOTAL_CARDS){
      throw new Error("伺服器回傳的卡片編號無效，請聯絡婚禮工作人員。");
    }
    showCard(slot);
  }catch(err){
    $("loading").classList.add("hidden");
    $("error").classList.remove("hidden");
    $("error").textContent = err.message || "暫時無法取得 Bingo 卡，請確認網路後重新整理。";
  }
}
start();
</script>
</body>
</html>
